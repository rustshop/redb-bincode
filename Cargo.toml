[package]
name = "redb-bincode"
version = "0.5.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Dawid Ciężarkiewicz <dpc@dpc.pw>"]
description = "`redb` + `bincode` wrapper around `redb`"
documentation = "https://github.com/rustshop/redb-bincode"
homepage = "https://github.com/rustshop/redb-bincode"
keywords = ["bincode", "database", "redb"]
readme = "README.md"
repository = "https://github.com/rustshop/redb-bincode"

[dependencies]
bincode = "2.0.0"
redb = "2.0.0"
thiserror = "1.0.58"

[dev-dependencies]
anyhow = "1.0.81"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
lto = "off"

[profile.ci]
incremental = false
inherits = "dev"
lto = "off"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"

# Workaround: https://github.com/rust-lang/cargo/issues/12457 which causes
#             https://github.com/ipetkov/crane/issues/370
[profile.dev.build-override]
debug = false
[profile.ci.build-override]
debug = false
[profile.release.build-override]
debug = false
